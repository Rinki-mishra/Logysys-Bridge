name: build

on:
  push:
    branches: [main, logysys-automation, 'feature/**']
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Restore
        run: dotnet restore LogisysOrgConverter.sln

      - name: Build
        run: dotnet build LogisysOrgConverter.sln --no-restore --configuration Release

      - name: Test
        run: >
          dotnet test LogisysOrgConverter.sln
          --no-build --configuration Release
          --logger "trx;LogFileName=test-results.trx"

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: '**/test-results.trx'
